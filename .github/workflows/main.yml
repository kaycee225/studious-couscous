name: WebTorrent & Pixeldrain

on:
  push:
    branches: Webtor
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '0bfe0b11-611d-4bb3-9b4c-36dbaa5a1fd5'
      LINK_FETCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/3ef2b179-9fb7-4f42-8c42-80f58ce33c23'
      KILL_SWITCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/3ef2b179-9fb7-4f42-8c42-80f58ce33c23'

    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt update && sudo apt install npm p7zip-full curl python3-requests -y && sudo npm install -g webtorrent-cli

      - name: Download, Pack & Upload
        run: |
          python3 - << 'EOF'
          import os, subprocess, time, requests, glob
          from datetime import datetime

          link_url = os.environ.get("LINK_FETCH_URL")
          kill_url = os.environ.get("KILL_SWITCH_URL")
          pd_key = os.environ.get("PIXELDRAIN_API_KEY")

          if kill_url:
              try:
                  if "STOP.ALL.TORRENTS" in requests.get(kill_url, timeout=5).text:
                      print("🛑 Global kill switch activated!")
                      exit(0)
              except Exception: pass

          magnet = requests.get(link_url).text.strip()
          os.makedirs("downloads", exist_ok=True)

          process = subprocess.Popen(["webtorrent", magnet, "--out", "downloads"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

          update_count = 0
          while process.poll() is None:
              update_count += 1
              timestamp = datetime.now().strftime("%H:%M:%S")
              line = process.stdout.readline()

              print(f"\n" + "="*50)
              print(f"🔄 [GH-WebTorrent-Pixeldrain] Progress Update #{update_count} | {timestamp}")
              print("-"*50)
              print(f"📥 Status: {line.strip()[:60]}")
              print("="*50 + "\n")
              time.sleep(5)

          subprocess.run(["7z", "a", "-v7000m", "webtorrent_bundle.7z", "downloads/*"], check=True)

          for archive in sorted(glob.glob("webtorrent_bundle*")):
              cmd = ["curl", "-s", "-X", "PUT", "-T", archive]
              if pd_key: cmd.extend(["-u", f":{pd_key}"])
              cmd.append(f"https://pixeldrain.com/api/file/{archive}")
              subprocess.run(cmd)
          EOF
