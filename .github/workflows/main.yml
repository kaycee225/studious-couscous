name: qBittorrent & Mocha

on:
  push:
    branches: jhg
    
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      MOCHA_API_TOKEN: 'mocha_pDeSsukaSgnuuwTBLZejQ2ADOLsBAZWgn58aFpddYOg'
      FOLDER_PATH: 'downloaded_files'
      LINK_FETCH_URL: 'https://utfdtjcnbprlhkhsdovt.supabase.co/functions/v1/download-page/d4905cfd-0c2a-446e-bf78-05c3ee7a49fe'
      KILL_SWITCH_URL: 'https://utfdtjcnbprlhkhsdovt.supabase.co/functions/v1/download-page/d4905cfd-0c2a-446e-bf78-05c3ee7a49fe'

    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install qbittorrent-nox jq curl zip p7zip-full python3 python3-requests python3-pip -y
          sudo python3 -m pip install --no-cache-dir --break-system-packages natsort

      - name: Download with qBittorrent & Boxed Progress
        run: |
          mkdir -p "$FOLDER_PATH"
          touch added_links.txt
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          Queueing\QueueEnabled=true
          Queueing\MaxActiveDownloads=10
          Queueing\MaxActiveTorrents=25
          EOF

          qbittorrent-nox -d
          sleep 5

          python3 - << 'EOF'
          import requests, time, os
          from datetime import datetime

          link_url = 'https://utfdtjcnbprlhkhsdovt.supabase.co/functions/v1/download-page/d4905cfd-0c2a-446e-bf78-05c3ee7a49fe'
          kill_url = 'https://utfdtjcnbprlhkhsdovt.supabase.co/functions/v1/download-page/d4905cfd-0c2a-446e-bf78-05c3ee7a49fe'
          folder_path = 'downloaded_files'
          absolute_save_path = os.path.abspath(folder_path)
          added_links = set()
          update_count = 0

          def fmt_eta(sec):
              if sec is None or sec < 0 or sec >= 8640000: return "∞"
              m, s = divmod(int(sec), 60); h, m = divmod(m, 60)
              return f"{h}h {m}m {s}s" if h else (f"{m}m {s}s" if m else f"{s}s")

          while True:
              update_count += 1
              timestamp = datetime.now().strftime("%H:%M:%S")

              if kill_url:
                  try:
                      ks = requests.get(kill_url, timeout=5).text
                      if "STOP.ALL.TORRENTS" in ks:
                          print("\n" + "="*50 + f"\n🛑 [GH-qBittorrent-Mocha] Global kill switch activated! | {timestamp}\n" + "="*50)
                          break
                      targets = [l.replace(' NO','').strip().lower() for l in ks.splitlines() if l.endswith(' NO') and l.strip()]
                      if targets:
                          res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                          for t in res:
                              if any(tg in t['name'].lower() for tg in targets if tg):
                                  requests.post('http://127.0.0.1:8080/api/v2/torrents/delete', data={'hashes': t['hash'], 'deleteFiles': 'true'})
                  except Exception: pass

              if link_url:
                  try:
                      page = requests.get(link_url, timeout=5).text
                      for link in page.splitlines():
                          link = link.strip()
                          if link and not link.startswith('#') and link not in added_links:
                              requests.post('http://127.0.0.1:8080/api/v2/torrents/add', data={'urls': link, 'savepath': absolute_save_path})
                              added_links.add(link)
                  except Exception: pass

              try:
                  res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                  print(f"\n" + "="*50)
                  print(f"🔄 [GH-qBittorrent-Mocha] Progress Update #{update_count} | {timestamp}")
                  print("-"*50)
                  if not res:
                      print("📥 Waiting for active torrents...")
                      all_done = False
                  else:
                      all_done = True
                      for t in res:
                          prog = int(t.get('progress', 0) * 100)
                          speed_mb = t.get('dlspeed', 0) / (1024 * 1024)
                          eta_str = fmt_eta(t.get('eta', -1))
                          print(f"📥 Torrent: {t['name']} | {prog}% | Speed: {speed_mb:.2f} MB/s | ETA: {eta_str}")
                          if prog < 100: all_done = False
                  print("="*50 + "\n")
                  if all_done and res: break
              except Exception: pass
              time.sleep(20)
          EOF

          pkill qbittorrent-nox || true
          sleep 2

      - name: Upload to mocha.my
        run: |
          python3 -u - << 'EOF'
          import os
          import subprocess
          import requests
          import time
          import fcntl
          from concurrent.futures import ThreadPoolExecutor
          from natsort import natsorted

          MOCHA_API_TOKEN = os.environ.get('MOCHA_API_TOKEN', 'mocha_pDeSsukaSgnuuwTBLZejQ2ADOLsBAZWgn58aFpddYOg')
          FOLDER_PATH = os.environ.get('FOLDER_PATH', 'downloaded_files')

          try:
              srv_res = requests.get("https://mocha.my/api/servers", timeout=10).json()
              SERVER = srv_res['data']['server']
          except Exception as e:
              print(f"Failed to fetch Mocha server: {e}")
              exit(1)

          def upload_single_file(file_path):
              filename = os.path.basename(file_path)
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"⬆ [START] Uploading: {filename} ({file_size_mb:.2f} MB)", flush=True)
              
              curl_cmd = [
                  "curl", "-X", "POST",
                  f"{SERVER}/upload.php",
                  "-H", f"Authorization: Bearer {MOCHA_API_TOKEN}",
                  "-F", f"file=@{file_path}",
                  "--max-time", "3600"
              ]
              
              proc = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              
              fd = proc.stderr.fileno()
              fl = fcntl.fcntl(fd, fcntl.F_GETFL)
              fcntl.fcntl(fd, fcntl.F_SETFL, fl | os.O_NONBLOCK)
              
              buffer = b""
              
              while proc.poll() is None:
                  try:
                      chunk = proc.stderr.read(1024)
                      if chunk:
                          buffer += chunk
                          if b'\r' in buffer or b'\n' in buffer:
                              lines = buffer.replace(b'\r', b'\n').split(b'\n')
                              buffer = lines[-1]
                              valid_lines = [L.decode('utf-8', errors='ignore').strip() for L in lines[:-1] if L.strip()]
                              for last_line in valid_lines:
                                  print(f"📤 Progress [{filename[:25]}]: {last_line}", flush=True)
                  except Exception:
                      pass
                  time.sleep(0.1)
                  
              stdout, stderr = proc.communicate()
              if stderr:
                  valid_lines = [L.decode('utf-8', errors='ignore').strip() for L in stderr.replace(b'\r', b'\n').split(b'\n') if L.strip()]
                  for last_line in valid_lines:
                      print(f"📤 Progress [{filename[:25]}]: {last_line}", flush=True)

              if proc.returncode == 0:
                  print(f"✅ Finished uploading {filename}: {stdout.decode('utf-8', errors='ignore').strip()}", flush=True)
              else:
                  err_msg = stderr.decode('utf-8', errors='ignore').strip() if stderr else 'Unknown error'
                  print(f"❌ Curl Error uploading {filename}: {err_msg}", flush=True)

          if os.path.exists(FOLDER_PATH):
              upload_queue = []
              for root, dirs, files in os.walk(FOLDER_PATH):
                  for filename in files:
                      if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                        upload_queue.append(os.path.join(root, filename))
              
              upload_queue = natsorted(upload_queue)
              
              if upload_queue:
                  print(f"🚀 Launching 4 parallel upload workers for {len(upload_queue)} files...", flush=True)
                  with ThreadPoolExecutor(max_workers=4) as executor:
                      executor.map(upload_single_file, upload_queue)
          EOF
