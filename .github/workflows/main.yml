name: qBittorrent & Pixeldrain

on:
  push:
    branches: Pix
    
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '0bfe0b11-611d-4bb3-9b4c-36dbaa5a1fd5'
      FOLDER_PATH: 'downloaded_files'
      LINK_FETCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/5ec77733-7e65-4d8f-b408-54eb01a369f6'
      KILL_SWITCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/5ec77733-7e65-4d8f-b408-54eb01a369f6'

    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt update && sudo apt install qbittorrent-nox jq curl zip p7zip-full python3 python3-requests -y

      - name: Download with qBittorrent & Boxed Progress
        run: |
          mkdir -p "$FOLDER_PATH"
          touch added_links.txt
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          Queueing\QueueEnabled=true
          Queueing\MaxActiveDownloads=10
          Queueing\MaxActiveTorrents=25
          EOF

          qbittorrent-nox -d
          sleep 5

          python3 - << 'EOF'
          import requests, time, os
          from datetime import datetime

          link_url = 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/5ec77733-7e65-4d8f-b408-54eb01a369f6'
          kill_url = 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/5ec77733-7e65-4d8f-b408-54eb01a369f6'
          folder_path = 'downloaded_files'
          absolute_save_path = os.path.abspath(folder_path)
          added_links = set()
          update_count = 0

          def fmt_eta(sec):
              if sec is None or sec < 0 or sec >= 8640000: return "∞"
              m, s = divmod(int(sec), 60); h, m = divmod(m, 60)
              return f"{h}h {m}m {s}s" if h else (f"{m}m {s}s" if m else f"{s}s")

          while True:
              update_count += 1
              timestamp = datetime.now().strftime("%H:%M:%S")

              if kill_url:
                  try:
                      ks = requests.get(kill_url, timeout=5).text
                      if "STOP.ALL.TORRENTS" in ks:
                          print("\n" + "="*50 + f"\n🛑 [GH-qBittorrent-Pixeldrain] Global kill switch activated! | {timestamp}\n" + "="*50)
                          break
                      targets = [l.replace(' NO','').strip().lower() for l in ks.splitlines() if l.endswith(' NO') and l.strip()]
                      if targets:
                          res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                          for t in res:
                              if any(tg in t['name'].lower() for tg in targets if tg):
                                  requests.post('http://127.0.0.1:8080/api/v2/torrents/delete', data={'hashes': t['hash'], 'deleteFiles': 'true'})
                  except Exception: pass

              if link_url:
                  try:
                      page = requests.get(link_url, timeout=5).text
                      for link in page.splitlines():
                          link = link.strip()
                          if link and not link.startswith('#') and link not in added_links:
                              requests.post('http://127.0.0.1:8080/api/v2/torrents/add', data={'urls': link, 'savepath': absolute_save_path})
                              added_links.add(link)
                  except Exception: pass

              try:
                  res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                  print(f"\n" + "="*50)
                  print(f"🔄 [GH-qBittorrent-Pixeldrain] Progress Update #{update_count} | {timestamp}")
                  print("-"*50)
                  if not res:
                      print("📥 Waiting for active torrents...")
                      all_done = False
                  else:
                      all_done = True
                      for t in res:
                          prog = int(t.get('progress', 0) * 100)
                          speed_mb = t.get('dlspeed', 0) / (1024 * 1024)
                          eta_str = fmt_eta(t.get('eta', -1))
                          print(f"📥 Torrent: {t['name']} | {prog}% | Speed: {speed_mb:.2f} MB/s | ETA: {eta_str}")
                          if prog < 100: all_done = False
                  print("="*50 + "\n")
                  if all_done and res: break
              except Exception: pass
              time.sleep(10)
          EOF

          pkill qbittorrent-nox || true
          sleep 2
          
      - name: Upload to Pixeldrain
        run: |
          python3 - << 'EOF'
          import os
          import requests

          api_key = os.environ.get("PIXELDRAIN_API_KEY")
          folder_path = os.environ.get("FOLDER_PATH", "downloaded_files")

          if not api_key:
              print("❌ Error: PIXELDRAIN_API_KEY is not set.")
              exit(1)

          if not os.path.exists(folder_path):
              print(f"❌ Error: Folder {folder_path} does not exist.")
              exit(1)

          for root, dirs, files in os.walk(folder_path):
              for filename in sorted(files):
                  if ".!qB" in filename or ".part" in filename:
                      continue
                  
                  file_path = os.path.join(root, filename)
                  print(f"📤 Uploading: {filename}...")

                  try:
                      with open(file_path, "rb") as f:
                          response = requests.post(
                              "https://pixeldrain.com/api/file",
                              auth=("", api_key),
                              files={"file": (filename, f)}
                          )
                      
                      res_json = response.json()
                      success = res_json.get("success", False)
                      file_id = res_json.get("id")

                      if success and file_id:
                          print(f"✅ Successfully uploaded: {filename} (ID: {file_id})")
                          os.remove(file_path)
                          print(f"🗑️ Cleaned up local file: {filename}")
                      else:
                          print(f"❌ Failed to upload {filename}. Response: {response.text}")
                          exit(1)
                  except Exception as e:
                      print(f"❌ Exception during upload of {filename}: {e}")
                      exit(1)
          EOF
