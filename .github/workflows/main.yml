name: Download Torrent and Upload to GoFile

on:
  workflow_dispatch:
  push:
    branches:
      - kaycee225-patch-1

jobs:
  download-group-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System & Python Dependencies
        run: |
          echo "📦 Installing qbittorrent-nox, curl, and python packages..."
          sudo apt update -qq
          sudo apt install -y -qq qbittorrent-nox python3 python3-requests python3-pip curl
          pip3 install --no-cache-dir --break-system-packages magnet2torrent requests natsort

      - name: Process Torrent Links & Magnets
        run: |
          echo "🧲 Converting magnets and queuing direct links..."
          mkdir -p downloads torrents
          python3 - << 'EOF'
          import asyncio
          import os
          import re
          import requests
          from urllib.parse import urlparse, unquote
          from magnet2torrent import Magnet2Torrent

          link_url = "https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/ecec22a2-a90a-4452-a6d5-62d7457350ed"

          def sanitize_path(name):
              if not name:
                  return "unnamed"
              name = unquote(name)
              sanitized = re.sub(r'[\\/*?:"<>|;]', '_', name)
              sanitized = re.sub(r'[\x00-\x1f\x7f]', '', sanitized)
              return sanitized.strip('. ') or "unnamed"

          async def main():
              try:
                  ks = requests.get(link_url, timeout=10).text
                  if "STOP.ALL.TORRENTS" in ks:
                      print("🛑 Global kill switch active.")
                      return
                      
                  direct_links = []
                  
                  for i, link in enumerate(ks.splitlines()):
                      link = link.strip()
                      if link and not link.startswith('#') and not link.endswith(' NO'):
                          if link.startswith('magnet:'):
                              print(f"📥 Converting magnet: {link[:60]}...", flush=True)
                              try:
                                  m2t = Magnet2Torrent(link)
                                  filename, torrent_data = await asyncio.wait_for(m2t.retrieve_torrent(), timeout=30)
                                  filename = sanitize_path(filename)
                                  if not filename.endswith('.torrent'):
                                      filename = f"{filename}.torrent"
                                  torrent_path = os.path.join("torrents", filename)
                                  with open(torrent_path, "wb") as f:
                                      f.write(torrent_data)
                                  print(f"✅ Saved torrent: {torrent_path}")
                              except (asyncio.TimeoutError, TimeoutError, Exception) as e:
                                  print(f"⚠️ Magnet conversion failed ({e}). Queuing raw magnet for fallback!", flush=True)
                                  direct_links.append(link)
                          elif link.startswith('http'):
                              if link.endswith('.torrent'):
                                  try:
                                      tor_data = requests.get(link, timeout=15).content
                                      parsed = urlparse(link)
                                      raw_fn = os.path.basename(parsed.path) or f"download_{i}.torrent"
                                      filename = sanitize_path(raw_fn)
                                      if not filename.endswith('.torrent'):
                                          filename = f"{filename}.torrent"
                                      with open(os.path.join('torrents', filename), 'wb') as tf:
                                          tf.write(tor_data)
                                      print(f"✅ Downloaded .torrent file: {filename}")
                                  except Exception as e:
                                      print(f"❌ Failed to download torrent file ({e}): {link}")
                              else:
                                  direct_links.append(link)
                                  print(f"🔗 Queued direct HTTP download: {link}")
                                  
                  if direct_links:
                      with open('direct_links.txt', 'w') as f:
                          f.write('\n'.join(direct_links))
                          
              except Exception as e:
                  print(f"Error processing links: {e}")

          asyncio.run(main())
          EOF

      - name: Configure & Start qBittorrent Daemon
        run: |
          echo "⚙️ Configuring and starting qbittorrent-nox daemon..."
          mkdir -p ~/.config/qBittorrent
          DOWNLOAD_DIR="$(pwd)/downloads"
          
          cat << EOF > ~/.config/qBittorrent/qBittorrent.conf
          [General]
          LegalNotice\Accepted=true

          [Preferences]
          Downloads\SavePath=${DOWNLOAD_DIR}
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          WebUI\Enabled=true
          WebUI\LocalHostAuth=false
          WebUI\Port=8080
          EOF

          qbittorrent-nox --daemon
          sleep 3
          curl -s http://127.0.0.1:8080/api/v2/app/version && echo " ✅ qBittorrent daemon ready."

      - name: Download Files via qbittorrent-nox
        run: |
          echo "🚀 Processing downloads using qbittorrent-nox API..."
          python3 -u - << 'EOF'
          import os
          import re
          import glob
          import time
          import requests
          from urllib.parse import urlparse, unquote, quote
          from natsort import natsorted

          QBIT_API = "http://127.0.0.1:8080/api/v2"

          def sanitize_path(name):
              if not name:
                  return "unnamed"
              name = unquote(name)
              sanitized = re.sub(r'[\\/*?:"<>|;]', '_', name)
              sanitized = re.sub(r'[\x00-\x1f\x7f]', '', sanitized)
              return sanitized.strip('. ') or "unnamed"

          def format_eta(eta_seconds):
              if eta_seconds is None or eta_seconds >= 8640000 or eta_seconds <= 0:
                  return "∞"
              m, s = divmod(eta_seconds, 60)
              h, m = divmod(m, 60)
              if h > 0:
                  return f"{h}h {m:02d}m {s:02d}s"
              return f"{m:02d}m {s:02d}s"

          def get_best_trackers():
              fallback_trackers = [
                  "udp://tracker.openbittorrent.com:80/announce",
                  "udp://tracker.opentrackr.org:1337/announce",
                  "udp://tracker.torrent.eu.org:451/announce",
                  "udp://exodus.desync.com:6969/announce",
                  "udp://open.stealth.si:80/announce",
                  "udp://tracker.tiny-vps.com:6969/announce",
                  "udp://opentracker.i2p.rocks:6969/announce",
                  "udp://tracker.moeking.me:6969/announce"
              ]
              try:
                  url = "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt"
                  res = requests.get(url, timeout=5)
                  if res.status_code == 200:
                      fetched = [line.strip() for line in res.text.splitlines() if line.strip()]
                      if fetched:
                          return fetched
              except Exception:
                  pass
              return fallback_trackers

          LIVE_TRACKERS = get_best_trackers()

          def download_http_file(url, output_dir="downloads"):
              try:
                  parsed = urlparse(url)
                  raw_filename = os.path.basename(parsed.path) or "downloaded_file"
                  filename = sanitize_path(raw_filename)
                  filepath = os.path.join(output_dir, filename)
                  print(f"📥 Downloading direct HTTP link: {filename}", flush=True)
                  with requests.get(url, stream=True, timeout=60) as r:
                      r.raise_for_status()
                      with open(filepath, 'wb') as f:
                          for chunk in r.iter_content(chunk_size=8192):
                              f.write(chunk)
                  print(f"✅ Finished HTTP download: {filename}", flush=True)
                  return filepath
              except Exception as e:
                  print(f"❌ Failed HTTP download ({url}): {e}", flush=True)
                  return None

          def add_torrent_file(filepath):
              try:
                  with open(filepath, 'rb') as f:
                      files = {'torrents': f}
                      res = requests.post(f"{QBIT_API}/torrents/add", files=files)
                      return res.status_code == 200
              except Exception as e:
                  print(f"⚠️ Error adding torrent file {filepath}: {e}")
                  return False

          def add_magnet_link(magnet_url):
              try:
                  # Append extra trackers to magnet URL for faster peer discovery
                  trackers_param = "".join([f"&tr={quote(t, safe='')}" for t in LIVE_TRACKERS])
                  full_magnet = magnet_url + trackers_param
                  data = {'urls': full_magnet}
                  res = requests.post(f"{QBIT_API}/torrents/add", data=data)
                  return res.status_code == 200
              except Exception as e:
                  print(f"⚠️ Error adding magnet {magnet_url[:40]}: {e}")
                  return False

          def monitor_qbit_downloads(stuck_timeout=60, max_timeout=3600):
              start_time = time.time()
              last_print_time = time.time()
              last_bytes = 0
              last_progress_time = time.time()
              
              completed_hashes = set()

              while True:
                  try:
                      res = requests.get(f"{QBIT_API}/torrents/info").json()
                  except Exception as e:
                      print(f"⚠️ Failed to query qBittorrent API: {e}")
                      time.sleep(3)
                      continue

                  if not res:
                      print("🎉 All queued torrents in qBittorrent finished!")
                      break

                  all_done = True
                  total_bytes = sum(t.get('completed', 0) for t in res)

                  if total_bytes > last_bytes:
                      last_bytes = total_bytes
                      last_progress_time = time.time()

                  for t in res:
                      t_hash = t['hash']
                      name = t['name']
                      progress = t['progress'] * 100
                      dlspeed = t['dlspeed'] / (1024 * 1024)  # MB/s
                      eta = t.get('eta', 8640000)
                      num_seeds = t.get('num_seeds', 0)
                      num_leechs = t.get('num_leechs', 0)
                      state = t.get('state', 'unknown')

                      # States considered complete in qBittorrent
                      is_finished = state in ['uploading', 'stalledUP', 'queuedUP', 'pausedUP', 'completed', 'forcedUP'] or progress >= 100.0

                      if is_finished:
                          if t_hash not in completed_hashes:
                              print(f"✅ Finished torrent: {name}", flush=True)
                              completed_hashes.add(t_hash)
                              # Delete torrent entry from qBittorrent without deleting downloaded files
                              requests.post(f"{QBIT_API}/torrents/delete", data={'hashes': t_hash, 'deleteFiles': 'false'})
                      else:
                          all_done = False

                  if all_done:
                      break

                  if time.time() - last_print_time >= 15:
                      for t in res:
                          if t['hash'] not in completed_hashes:
                              p = t['progress'] * 100
                              speed = t['dlspeed'] / (1024 * 1024)
                              eta_str = format_eta(t.get('eta', 8640000))
                              print(f"📊 Progress [{t['name'][:30]}]: {p:.2f}% | "
                                    f"Down: {speed:.2f} MB/s | "
                                    f"ETA: {eta_str} | "
                                    f"Peers: {t.get('num_leechs', 0)} (Seeds: {t.get('num_seeds', 0)}) | "
                                    f"State: {t.get('state')}", flush=True)
                      last_print_time = time.time()

                  if total_bytes == 0 and (time.time() - start_time) > stuck_timeout:
                      print(f"⏱️ Stuck at 0 bytes for {stuck_timeout}s. Aborting remaining downloads.", flush=True)
                      break

                  if (time.time() - start_time) > max_timeout:
                      print(f"⏱️ Max timeout ({max_timeout}s) reached. Aborting remaining downloads.", flush=True)
                      break

                  time.sleep(3)

          def main():
              os.makedirs("downloads", exist_ok=True)
              torrent_files = natsorted(glob.glob("torrents/*.torrent"))

              for tf in torrent_files:
                  print(f"📥 Adding torrent file to qBittorrent: {os.path.basename(tf)}")
                  add_torrent_file(tf)

              if os.path.exists("direct_links.txt"):
                  with open("direct_links.txt", "r") as f:
                      links = [line.strip() for line in f if line.strip()]
                      for link in links:
                          if link.startswith('magnet:'):
                              print(f"📥 Adding magnet link to qBittorrent: {link[:50]}...")
                              add_magnet_link(link)
                          elif link.startswith('http'):
                              download_http_file(link)

              monitor_qbit_downloads()

          if __name__ == "__main__":
              main()
          EOF

      - name: Organize Files into Dedicated Folders
        run: |
          echo "📂 Organizing all movies and TV shows into dedicated directories..."
          python3 - << 'EOF'
          import os, shutil, re
          from datetime import datetime
          from collections import defaultdict
          from natsort import natsorted
          from urllib.parse import unquote

          folder = "downloads"
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')

          def sanitize_path(name):
              if not name:
                  return "unnamed"
              name = unquote(name)
              sanitized = re.sub(r'[\\/*?:"<>|;]', '_', name)
              sanitized = re.sub(r'[\x00-\x1f\x7f]', '', sanitized)
              return sanitized.strip('. ') or "unnamed"

          def parse_tv_show(name):
              m = re.search(r'(?i)(?:^(.*?)[.\s_\[\(-]+)?S(\d{1,2})(?:[EX\d\-]|\b)', name)
              if m:
                  return m.group(1), m.group(2)
              m = re.search(r'(?i)(?:^(.*?)[.\s_\[\(-]+)?(\d{1,2})x\d{1,2}', name)
              if m:
                  return m.group(1), m.group(2)
              m = re.search(r'(?i)(?:^(.*?)[.\s_\[\(-]+)?Season[.\s_-]*(\d{1,2})', name)
              if m:
                  return m.group(1), m.group(2)
              return None, None

          sanitized_names_map = {}

          # 0. Sanitize all raw files & directories on disk, tracking original names
          for r, dirs, files in os.walk(folder, topdown=False):
              for f in files:
                  clean_f = sanitize_path(f)
                  if clean_f != f:
                      old_p = os.path.join(r, f)
                      new_p = os.path.join(r, clean_f)
                      if not os.path.exists(new_p):
                          shutil.move(old_p, new_p)
                      sanitized_names_map[new_p] = f
              for d in dirs:
                  clean_d = sanitize_path(d)
                  if clean_d != d:
                      old_p = os.path.join(r, d)
                      new_p = os.path.join(r, clean_d)
                      if not os.path.exists(new_p):
                          shutil.move(old_p, new_p)
                      sanitized_names_map[new_p] = d

          def move_files_to_group_dir(group_name, file_paths, base_dir, original_group_name=None):
              clean_group_name = sanitize_path(group_name)
              group_dir = os.path.join(base_dir, clean_group_name)
              os.makedirs(group_dir, exist_ok=True)
              
              log_entries = []
              orig_folder = original_group_name or group_name
              if orig_folder != clean_group_name:
                  log_entries.append(f"[FOLDER RENAMED]\nOriginal : {orig_folder}\nSanitized: {clean_group_name}\n")

              files_to_move = list(file_paths)
              for p in file_paths:
                  base_stem = os.path.splitext(p)[0]
                  for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                      sub_file = base_stem + sub_ext
                      if os.path.exists(sub_file) and sub_file not in files_to_move:
                          files_to_move.append(sub_file)

              for p in files_to_move:
                  if os.path.exists(p):
                      clean_filename = os.path.basename(p)
                      orig_filename = sanitized_names_map.get(p, clean_filename)
                      
                      if orig_filename != clean_filename:
                          log_entries.append(f"[FILE RENAMED]\nOriginal : {orig_filename}\nSanitized: {clean_filename}\n")

                      dst = os.path.join(group_dir, clean_filename)
                      if p != dst and not os.path.exists(dst):
                          shutil.move(p, dst)

              if log_entries:
                  log_file_path = os.path.join(group_dir, "name_mapping.txt")
                  with open(log_file_path, "w", encoding="utf-8") as lf:
                      lf.write("==================================================\n")
                      lf.write("             NAME SANITIZATION LOG                \n")
                      lf.write("==================================================\n\n")
                      lf.write("\n".join(log_entries))
                      lf.write("\n==================================================\n")
                  print(f"📝 Created sanitization log: {log_file_path}", flush=True)

          all_videos = []
          for r, _, files in os.walk(folder):
              for f in files:
                  if f.lower().endswith(video_ext):
                      all_videos.append(os.path.join(r, f))

          all_videos = natsorted(all_videos)
          
          series_groups = defaultdict(list)
          movies = []
          short_series_pool = []

          for vid_path in all_videos:
              vid_name = os.path.basename(vid_path)
              parent_name = os.path.basename(os.path.dirname(vid_path))
              
              raw_title, s_num = parse_tv_show(vid_name)
              if not s_num:
                  raw_title, s_num = parse_tv_show(parent_name)

              if s_num:
                  raw_title = raw_title.strip('. -_[]()') if raw_title else "Season"
                  s_num_formatted = f"{int(s_num):02d}"
                  group_key = f"{raw_title}_S{s_num_formatted}"
                  series_groups[group_key].append(vid_path)
              else:
                  movies.append(vid_path)

          for group_key in natsorted(series_groups.keys()):
              vids = natsorted(series_groups[group_key])
              if len(vids) > 3:
                  first_ep_path = vids[0]
                  clean_first_ep_name = os.path.splitext(os.path.basename(first_ep_path))[0]
                  orig_first_ep_name = os.path.splitext(sanitized_names_map.get(first_ep_path, os.path.basename(first_ep_path)))[0]
                  
                  print(f"📁 TV Series (>3 ep) -> Folder named after 1st ep: {clean_first_ep_name}", flush=True)
                  move_files_to_group_dir(clean_first_ep_name, vids, folder, original_group_name=orig_first_ep_name)
              else:
                  short_series_pool.extend(vids)

          if len(short_series_pool) > 3:
              current_date = datetime.now().strftime("%Y-%m-%d")
              print(f"📁 Bundling loose series pool ({len(short_series_pool)} vids) into date folder: {current_date}", flush=True)
              move_files_to_group_dir(current_date, short_series_pool, folder)
          else:
              movies.extend(short_series_pool)

          for movie_path in natsorted(movies):
              clean_movie_stem = os.path.splitext(os.path.basename(movie_path))[0]
              orig_movie_stem = os.path.splitext(sanitized_names_map.get(movie_path, os.path.basename(movie_path)))[0]
              
              print(f"🎬 Creating dedicated folder for movie/item: {clean_movie_stem}", flush=True)
              move_files_to_group_dir(clean_movie_stem, [movie_path], folder, original_group_name=orig_movie_stem)

          for r, dirs, files in os.walk(folder, topdown=False):
              if r == folder: continue
              if not os.listdir(r):
                  shutil.rmtree(r, ignore_errors=True)
          EOF

      - name: Split Oversized Folders (17GB Limit)
        run: |
          echo "✂️ Checking folder sizes and splitting folders over 17GB..."
          python3 - << 'EOF'
          import os
          import re
          import shutil
          from natsort import natsorted

          downloads_dir = "downloads"
          MAX_BYTES = 17 * 1024 * 1024 * 1024  # 17 GB limit

          def sanitize_path(name):
              sanitized = re.sub(r'[\\/*?:"<>|;]', '_', name)
              sanitized = re.sub(r'[\x00-\x1f\x7f]', '', sanitized)
              return sanitized.strip('. ') or "unnamed"

          if os.path.exists(downloads_dir):
              entries = natsorted(os.listdir(downloads_dir))
              for entry in entries:
                  entry_path = os.path.join(downloads_dir, entry)
                  
                  if os.path.isdir(entry_path):
                      all_files = []
                      total_folder_size = 0
                      
                      for root, _, files in os.walk(entry_path):
                          for f in files:
                              fp = os.path.join(root, f)
                              sz = os.path.getsize(fp)
                              all_files.append((fp, sz))
                              total_folder_size += sz

                      if total_folder_size > MAX_BYTES:
                          size_gb = total_folder_size / (1024 ** 3)
                          print(f"📦 Folder '{entry}' is {size_gb:.2f} GB (>17GB). Splitting into parts...", flush=True)
                          
                          all_files = natsorted(all_files, key=lambda x: x[0])
                          part_num = 1
                          current_part_size = 0
                          
                          for fp, sz in all_files:
                              if current_part_size + sz > MAX_BYTES and current_part_size > 0:
                                  part_num += 1
                                  current_part_size = 0
                              
                              part_dir_name = sanitize_path(f"{entry}_Part_{part_num}")
                              part_dir_path = os.path.join(downloads_dir, part_dir_name)
                              os.makedirs(part_dir_path, exist_ok=True)
                              
                              rel_path = os.path.relpath(fp, entry_path)
                              target_fp = os.path.join(part_dir_path, rel_path)
                              os.makedirs(os.path.dirname(target_fp), exist_ok=True)
                              
                              shutil.move(fp, target_fp)
                              current_part_size += sz
                              print(f"  └─ Moved to {part_dir_name}: {os.path.basename(fp)}", flush=True)
                          
                          shutil.rmtree(entry_path, ignore_errors=True)
                          print(f"✅ Finished splitting '{entry}' into {part_num} parts.", flush=True)
          EOF

      - name: Parallel Upload to GoFile
        run: |
          echo "📤 Running Parallel Multi-Threaded Uploads to GoFile..."
          python3 - << 'EOF'
          import os
          import re
          import subprocess
          import requests
          import time
          import fcntl
          from concurrent.futures import ThreadPoolExecutor
          from natsort import natsorted

          GOFILE_TOKEN = 'VoTnBsgTAiTqm97X6FmvdmBswsMPl6SG'
          PARENT_FOLDER_ID = '6af360d4-d348-470b-8d25-40e961cb9565'
          FOLDER_PATH = 'downloads'

          def sanitize_path(name):
              sanitized = re.sub(r'[\\/*?:"<>|;]', '_', name)
              sanitized = re.sub(r'[\x00-\x1f\x7f]', '', sanitized)
              return sanitized.strip('. ') or "unnamed"

          try:
              srv_res = requests.get("https://api.gofile.io/servers", timeout=10).json()
              if srv_res.get('status') == 'ok' and srv_res.get('data', {}).get('servers'):
                  SERVER = srv_res['data']['servers'][0]['name']
                  UPLOAD_URL = f"https://{SERVER}.gofile.io/contents/uploadfile"
              else:
                  UPLOAD_URL = "https://store1.gofile.io/contents/uploadfile"
          except Exception as e:
              print(f"Failed to fetch GoFile server ({e}), using default endpoint.")
              UPLOAD_URL = "https://store1.gofile.io/contents/uploadfile"

          def create_gofile_folder(folder_name, parent_id=""):
              try:
                  clean_folder_name = sanitize_path(folder_name)
                  headers = {"Authorization": f"Bearer {GOFILE_TOKEN}"} if GOFILE_TOKEN else {}
                  data = {"folderName": clean_folder_name}
                  if parent_id:
                      data["parentFolderId"] = parent_id
                  res = requests.post("https://api.gofile.io/contents/createFolder", json=data, headers=headers, timeout=15).json()
                  if res.get('status') == 'ok':
                      new_id = res['data']['id']
                      print(f"📁 Created GoFile Folder: {clean_folder_name} (ID: {new_id})", flush=True)
                      return new_id
              except Exception as e:
                  print(f"⚠️ Failed to create folder {folder_name} on GoFile: {e}", flush=True)
              return parent_id

          def upload_single_file(item_info):
              file_path, target_folder_id = item_info
              filename = os.path.basename(file_path)
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"⬆️ [START] Uploading: {filename} ({file_size_mb:.2f} MB)", flush=True)
              
              curl_cmd = [
                  "curl", "-X", "POST", UPLOAD_URL,
                  "-F", f'file=@"{file_path}"'
              ]
              if GOFILE_TOKEN:
                  curl_cmd.extend(["-H", f"Authorization: Bearer {GOFILE_TOKEN}"])
              if target_folder_id:
                  curl_cmd.extend(["-F", f"folderId={target_folder_id}"])
                  
              curl_cmd.extend(["--max-time", "3600"])
              
              proc = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              
              fd = proc.stderr.fileno()
              fl = fcntl.fcntl(fd, fcntl.F_GETFL)
              fcntl.fcntl(fd, fcntl.F_SETFL, fl | os.O_NONBLOCK)
              
              last_print_time = time.time()
              buffer = b""
              
              while proc.poll() is None:
                  try:
                      chunk = proc.stderr.read(1024)
                      if chunk:
                          buffer += chunk
                          if b'\r' in buffer or b'\n' in buffer:
                              lines = buffer.replace(b'\r', b'\n').split(b'\n')
                              buffer = lines[-1]
                              valid_lines = [L.decode('utf-8', errors='ignore').strip() for L in lines[:-1] if L.strip()]
                              if valid_lines:
                                  last_line = valid_lines[-1]
                                  if time.time() - last_print_time >= 30:
                                      print(f"📤 Progress [{filename[:25]}]: {last_line}", flush=True)
                                      last_print_time = time.time()
                  except Exception:
                      pass
                  time.sleep(0.5)
                  
              stdout, stderr = proc.communicate()
              if proc.returncode == 0:
                  print(f"✅ Finished uploading {filename}: {stdout.decode('utf-8', errors='ignore').strip()}", flush=True)
              else:
                  err_msg = stderr.decode('utf-8', errors='ignore').strip() if stderr else 'Unknown error'
                  print(f"❌ Curl Error uploading {filename}: {err_msg}", flush=True)

          if os.path.exists(FOLDER_PATH):
              upload_tasks = []
              
              for entry in natsorted(os.listdir(FOLDER_PATH)):
                  full_path = os.path.join(FOLDER_PATH, entry)
                  
                  if os.path.isdir(full_path):
                      gofile_subfolder_id = create_gofile_folder(entry, PARENT_FOLDER_ID)
                      for root, _, files in os.walk(full_path):
                          for f in files:
                              if not any(ext in f for ext in [".!qB", ".part", ".aria2"]):
                                  upload_tasks.append((os.path.join(root, f), gofile_subfolder_id))
                  elif os.path.isfile(full_path):
                      if not any(ext in entry for ext in [".!qB", ".part", ".aria2"]):
                          upload_tasks.append((full_path, PARENT_FOLDER_ID))
              
              if upload_tasks:
                  print(f"🚀 Launching 4 parallel upload workers for {len(upload_tasks)} files...", flush=True)
                  with ThreadPoolExecutor(max_workers=4) as executor:
                      executor.map(upload_single_file, upload_tasks)
          EOF
