name: qBittorrent & Pixeldrain (GitHub)

on:
  push:
    branches: Qbitpix
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: 'd5a25155-ac2d-4a93-96fa-1754677248c1'
      LINK_FETCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/ce8d8c24-ef9c-42cb-a573-e13fc1a97381'
      KILL_SWITCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/ce8d8c24-ef9c-42cb-a573-e13fc1a97381'

    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt update && sudo apt install qbittorrent-nox p7zip-full curl python3-requests -y

      - name: Download, Pack & Upload
        run: |
          python3 - << 'EOF'
          import os, subprocess, time, requests, glob, urllib.parse
          from datetime import datetime

          link_url = os.environ.get("LINK_FETCH_URL")
          kill_url = os.environ.get("KILL_SWITCH_URL")
          pd_key = os.environ.get("PIXELDRAIN_API_KEY")

          if kill_url:
              try:
                  if "STOP.ALL.TORRENTS" in requests.get(kill_url, timeout=5).text:
                      print("🛑 Global kill switch activated!")
                      exit(0)
              except Exception: pass

          magnet = requests.get(link_url).text.strip()
          os.makedirs("downloads", exist_ok=True)

          # Start qbittorrent-nox in daemon mode
          subprocess.Popen(["qbittorrent-nox", "--daemon"])
          print("[*] Waiting for qBittorrent daemon Web UI to initialize...")
          time.sleep(6)

          # Add torrent via qBittorrent Web API (default user: admin / adminadmin or unauthenticated localhost)
          ses = requests.Session()
          try:
              ses.post("http://localhost:8080/api/v2/auth/login", data={"username": "admin", "password": "adminadmin"})
          except Exception:
              pass

          add_res = ses.post("http://localhost:8080/api/v2/torrents/add", data={
              "urls": magnet,
              "savepath": os.path.abspath("downloads")
          })
          print(f"Add Torrent Response: {add_res.text}")

          update_count = 0
          while True:
              update_count += 1
              timestamp = datetime.now().strftime("%H:%M:%S")
              
              try:
                  torrents = ses.get("http://localhost:8080/api/v2/torrents/info").json()
                  if torrents:
                      t = torrents[0]
                      progress = t.get("progress", 0) * 100
                      state = t.get("state", "unknown")
                      print(f"\n" + "="*50)
                      print(f"🔄 [GH-qBittorrent-Pixeldrain] Progress Update #{update_count} | {timestamp}")
                      print("-"*50)
                      print(f"📥 Progress: {progress:.2f}% | State: {state}")
                      print("="*50 + "\n")
                      if progress >= 100 or state in ["uploading", "pausedUP", "stalledUP", "completed"]:
                          break
                  else:
                      print(f"[*] Waiting for torrent info... (Attempt {update_count})")
              except Exception as e:
                  print(f"[*] Polling error: {e}")

              time.sleep(10)

          subprocess.run(["7z", "a", "-v9000m", "qbittorrent_output.7z", "downloads/"], check=True)

          for archive in sorted(glob.glob("qbittorrent_output*")):
              encoded_name = urllib.parse.quote(archive)
              url = f"https://pixeldrain.com/api/file/{encoded_name}"
              print(f"[*] Uploading {archive} to Pixeldrain...")
              with open(archive, "rb") as f:
                  auth = ("", pd_key) if pd_key else None
                  res = requests.put(url, data=f, auth=auth)
                  print(f"Upload Response: {res.status_code} - {res.text}")
          EOF
