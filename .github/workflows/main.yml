name: Torrent Download & Upload to Buzzheavier

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      BUZZHEAVIER_API_KEY: 'FINS3KA5OL68CPW5MEYD'
      FOLDER_PATH: 'downloaded_files'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install qbittorrent-nox jq curl zip python3 python3-requests -y
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with qBittorrent
        run: |
          mkdir -p "$FOLDER_PATH"
          
          # Pre-configure qBittorrent to bypass legal terms and localhost authentication
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          EOF

          # Start qbittorrent daemon in background
          qbittorrent-nox -d
          sleep 5

          # Add magnet links via Web API
          while IFS= read -r link || [ -n "$link" ]; do
            link=$(echo "$link" | tr -d '\r')
            if [ -n "$link" ] && [[ ! "$link" =~ ^# ]]; then
              echo "Adding to qBittorrent: $link"
              curl -s -X POST \
                -F "urls=$link" \
                -F "savepath=$PWD/$FOLDER_PATH" \
                http://127.0.0.1:8080/api/v2/torrents/add
            fi
          done < page.txt

          echo "Waiting for all torrents to finish downloading..."
          
          # Monitoring loop via Web API with 5-minute kill switch
          CHECK_COUNTER=0
          
          while true; do
            sleep 10
            CHECK_COUNTER=$((CHECK_COUNTER + 1))
            
            # 30 iterations * 10s = 300 seconds (5 minutes)
            if [ "$CHECK_COUNTER" -ge 30 ]; then
              echo "Checking kill switch URL..."
              KILL_STATUS=$(curl -s https://klipit.in/cng83623 || echo "")
              
              if echo "$KILL_STATUS" | grep -q "STOP.ALL.TORRENTS"; then
                echo "🛑 Kill switch activated! 'STOP.ALL.TORRENTS' detected."
                echo "Stopping downloads and proceeding with currently finished files..."
                break
              fi
              
              # Reset counter for the next 5-minute block
              CHECK_COUNTER=0
            fi
            
            RESPONSE=$(curl -s http://127.0.0.1:8080/api/v2/torrents/info)
            
            TOTAL=$(echo "$RESPONSE" | jq '. | length' 2>/dev/null || echo "0")
            INCOMPLETE=$(echo "$RESPONSE" | jq '[.[] | select(.progress < 1)] | length' 2>/dev/null || echo "0")
            
            if [ "$TOTAL" -eq 0 ]; then
              echo "No active torrents found."
              break
            fi

            echo "--> Total torrents: $TOTAL | Incomplete: $INCOMPLETE"
            
            if [ "$INCOMPLETE" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "✅ All downloads completed naturally!"
              break
            fi
          done

          # Cleanup partial pieces before stopping to ensure clean state
          echo "Cleaning up incomplete/partial files (!qB)..."
          find "$PWD/$FOLDER_PATH" -type f -name "*.!qB" -delete
          find "$PWD/$FOLDER_PATH" -type d -name ".unwanted" -exec rm -rf {} + || true

          # Stop qbittorrent daemon
          pkill qbittorrent-nox || true
          sleep 2

      - name: Upload Files Directly to Buzzheavier
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import subprocess
          import urllib.parse

          download_dir = os.path.abspath(os.environ.get("FOLDER_PATH", "downloaded_files"))
          BUZZHEAVIER_API_KEY = os.environ.get("BUZZHEAVIER_API_KEY", "")

          final_upload_files = []

          # Recursively collect all completed files while strictly ignoring incomplete files
          for root, _, files in os.walk(download_dir):
              if '.unwanted' in root:
                  continue
              for f in files:
                  # Explicitly filter out incomplete qBittorrent or temporary download parts
                  if f.endswith('.!qB') or f.endswith('.part') or f.endswith('.crdownload'):
                      continue
                  fpath = os.path.join(root, f)
                  if os.path.isfile(fpath):
                      final_upload_files.append(fpath)

          print(f"\nUploading {len(final_upload_files)} completed file(s) to Buzzheavier...")

          has_failed = False
          for file_path in final_upload_files:
              file_name = os.path.basename(file_path)
              print(f"Uploading: {file_name}")

              try:
                  encoded_name = urllib.parse.quote(file_name)
                  url = f"https://w.buzzheavier.com/{encoded_name}"
                  
                  # Buzzheavier uses a PUT request with -T for file streaming/upload
                  curl_cmd = [
                      "curl", "-s", "-o", "-", "-X", "PUT",
                      "-H", f"Authorization: Bearer {BUZZHEAVIER_API_KEY}",
                      "-T", file_path,
                      url
                  ]
                  
                  result = subprocess.run(curl_cmd, capture_output=True, text=True)
                  out_text = result.stdout.strip()
                  
                  if '"id":' in out_text.lower() or '"success":true' in out_text.lower() or len(out_text) > 0:
                      print(f" -> ✅ Uploaded: {file_name} | Response: {out_text}")
                  else:
                      print(f" -> ❌ Failed: {file_name} | Response: {out_text}")
                      has_failed = True

              except Exception as e:
                  print(f" -> ❌ Error uploading {file_name}: {e}")
                  has_failed = True

          if has_failed:
              sys.exit(1)
          EOF
