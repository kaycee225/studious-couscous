name: Torrent Download & Upload to Buzzheavier

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      BUZZHEAVIER_API_KEY: 'FINS3KA5OL68CPW5MEYD'
      FOLDER_PATH: 'downloaded_files'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install qbittorrent-nox jq curl zip python3 python3-requests -y
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with qBittorrent & Live Progress
        run: |
          mkdir -p "$FOLDER_PATH"
          
          # Pre-configure qBittorrent to bypass legal terms and localhost authentication
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          EOF

          # Start qbittorrent daemon in background
          qbittorrent-nox -d
          sleep 5

          # Add magnet links via Web API
          while IFS= read -r link || [ -n "$link" ]; do
            link=$(echo "$link" | tr -d '\r')
            if [ -n "$link" ] && [[ ! "$link" =~ ^# ]]; then
              echo "Adding to qBittorrent: $link"
              curl -s -X POST \
                -F "urls=$link" \
                -F "savepath=$PWD/$FOLDER_PATH" \
                http://127.0.0.1:8080/api/v2/torrents/add
            fi
          done < page.txt

          echo "Waiting for all torrents to finish downloading with live progress..."
          
          # Monitoring loop via Web API with live percentage display and 5-minute kill switch
          CHECK_COUNTER=0
          
          while true; do
            sleep 10
            CHECK_COUNTER=$((CHECK_COUNTER + 1))
            
            # 30 iterations * 10s = 300 seconds (5 minutes)
            if [ "$CHECK_COUNTER" -ge 12 ]; then
              echo "Checking kill switch URL..."
              KILL_STATUS=$(curl -s https://klipit.in/cng83623 || echo "")
              
              if echo "$KILL_STATUS" | grep -q "STOP.ALL.TORRENTS"; then
                echo "🛑 Kill switch activated! 'STOP.ALL.TORRENTS' detected."
                echo "Stopping downloads and proceeding with currently finished files..."
                break
              fi
              
              CHECK_COUNTER=0
            fi
            
            RESPONSE=$(curl -s http://127.0.0.1:8080/api/v2/torrents/info)
            
            TOTAL=$(echo "$RESPONSE" | jq '. | length' 2>/dev/null || echo "0")
            
            if [ "$TOTAL" -eq 0 ]; then
              echo "No active torrents found."
              break
            fi

            # Print live progress for each active torrent
            echo "$RESPONSE" | jq -r '.[] | "📥 Torrent: \(.name) | Progress: \((.progress * 100 | floor))% | State: \(.state)"'
            
            INCOMPLETE=$(echo "$RESPONSE" | jq '[.[] | select(.progress < 1)] | length' 2>/dev/null || echo "0")
            
            if [ "$INCOMPLETE" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "✅ All downloads completed naturally!"
              break
            fi
          done

          # Purge any torrents/files that did not reach 100% completion
          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import shutil

          try:
              res = subprocess.run(["curl", "-s", "http://127.0.0.1:8080/api/v2/torrents/info"], capture_output=True, text=True)
              torrents = json.loads(res.stdout)
              
              for t in torrents:
                  name = t.get('name', 'Unknown')
                  progress = t.get('progress', 0.0)
                  content_path = t.get('content_path', '')
                  
                  print(f"Checking final status -> '{name}': {progress * 100:.1f}%")
                  
                  if progress < 1.0:
                      print(f"❌ Skipping & deleting incomplete download (< 100%): {content_path}")
                      if content_path and os.path.exists(content_path):
                          if os.path.isdir(content_path):
                              shutil.rmtree(content_path, ignore_errors=True)
                          else:
                              os.remove(content_path)
          except Exception as e:
              print(f"Error filtering incomplete torrents: {e}")
          EOF

          # Cleanup partial pieces
          find "$PWD/$FOLDER_PATH" -type f \( -name "*.!qB" -o -name "*.part" \) -delete
          find "$PWD/$FOLDER_PATH" -type d -name ".unwanted" -exec rm -rf {} + || true

          # Stop qbittorrent daemon
          pkill qbittorrent-nox || true
          sleep 2

      - name: Upload Completed Files to Buzzheavier
        env:
          TARGET_URL: 'https://w.buzzheavier.com/roj8pv25ry0k'
          ACCOUNT_ID: '${{ env.BUZZHEAVIER_API_KEY }}'
        run: |
          LOCAL_DIR="$FOLDER_PATH"
          
          echo "Starting recursive upload of 100% completed files..."
          
          # Loop through all files in the directory recursively using your upload layout
          find "$LOCAL_DIR" -type f | while read -r FILE; do
              # Skip hidden or residue files just in case
              if [[ "$FILE" == *.!qB ]] || [[ "$FILE" == *.part ]] || [[ "$FILE" == *"/."* ]]; then
                  continue
              fi
              
              FILENAME=$(basename "$FILE")
              echo "Uploading: $FILENAME"
              
              curl -#o - -T "$FILE" \
              -H "Authorization: Bearer $ACCOUNT_ID" \
              "$TARGET_URL/$FILENAME"
              
              echo ""
          done
