Name: Torrent Download & Smart Upload to VikingFile

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      VIKINGFILE_USER_HASH: '8IcySE8jai'
      FOLDER_PATH: 'downloaded_files'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install qbittorrent-nox jq curl zip python3 python3-requests -y
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with qBittorrent & Live Progress
        run: |
          mkdir -p "$FOLDER_PATH"
          
          # Pre-configure qBittorrent to bypass legal terms and localhost authentication
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          EOF

          # Start qbittorrent daemon in background
          qbittorrent-nox -d
          sleep 5

          # Add magnet links via Web API
          while IFS= read -r link || [ -n "$link" ]; do
            link=$(echo "$link" | tr -d '\r')
            if [ -n "$link" ] && [[ ! "$link" =~ ^# ]]; then
              echo "Adding to qBittorrent: $link"
              curl -s -X POST \
                -F "urls=$link" \
                -F "savepath=$PWD/$FOLDER_PATH" \
                http://127.0.0.1:8080/api/v2/torrents/add
            fi
          done < page.txt

          echo "Waiting for all torrents to finish downloading with live progress..."
          
          CHECK_COUNTER=0
          while true; do
            sleep 10
            CHECK_COUNTER=$((CHECK_COUNTER + 1))
            
            # 30 iterations * 10s = 300 seconds (5 minutes)
            if [ "$CHECK_COUNTER" -ge 6 ]; then
              echo "Checking kill switch URL..."
              KILL_STATUS=$(curl -s https://klipit.in/cng83623 || echo "")
              
              if echo "$KILL_STATUS" | grep -q "STOP.ALL.TORRENTS"; then
                echo "🛑 Kill switch activated! 'STOP.ALL.TORRENTS' detected."
                echo "Stopping downloads and proceeding with currently downloaded files..."
                break
              fi
              
              CHECK_COUNTER=0
            fi
            
            RESPONSE=$(curl -s http://127.0.0.1:8080/api/v2/torrents/info)
            TOTAL=$(echo "$RESPONSE" | jq '. | length' 2>/dev/null || echo "0")
            
            if [ "$TOTAL" -eq 0 ]; then
              echo "No active torrents found."
              break
            fi

            echo "$RESPONSE" | jq -r '.[] | "📥 Torrent: \(.name) | Progress: \((.progress * 100 | floor))% | State: \(.state)"'
            
            INCOMPLETE=$(echo "$RESPONSE" | jq '[.[] | select(.progress < 1)] | length' 2>/dev/null || echo "0")
            if [ "$INCOMPLETE" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "✅ All downloads completed naturally!"
              break
            fi
          done

          # Purge incomplete downloads (< 100%)
          python3 - << 'EOF'
          import json, os, subprocess, shutil
          try:
              res = subprocess.run(["curl", "-s", "http://127.0.0.1:8080/api/v2/torrents/info"], capture_output=True, text=True)
              torrents = json.loads(res.stdout)
              for t in torrents:
                  name = t.get('name', 'Unknown')
                  progress = t.get('progress', 0.0)
                  content_path = t.get('content_path', '')
                  print(f"Checking final status -> '{name}': {progress * 100:.1f}%")
                  if progress < 1.0:
                      print(f"❌ Skipping & deleting incomplete download (< 100%): {content_path}")
                      if content_path and os.path.exists(content_path):
                          if os.path.isdir(content_path):
                              shutil.rmtree(content_path, ignore_errors=True)
                          else:
                              os.remove(content_path)
          except Exception as e:
              print(f"Error filtering incomplete torrents: {e}")
          EOF

          find "$PWD/$FOLDER_PATH" -type f \( -name "*.!qB" -o -name "*.part" \) -delete
          find "$PWD/$FOLDER_PATH" -type d -name ".unwanted" -exec rm -rf {} + || true

          pkill qbittorrent-nox || true
          sleep 2

      - name: Smart Zipping, Splitting (>8GB), & Organization
        run: |
          python3 - << 'EOF'
          import os
          import zipfile
          import shutil
          import subprocess

          root_dir = "downloaded_files"
          if not os.path.exists(root_dir):
              os.makedirs(root_dir)

          video_extensions = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          MAX_SIZE_BYTES = 7.5 * 1024 * 1024 * 1024  # 7.5 GB threshold to safely stay under the 8GB limit

          def split_large_file(file_path):
              if os.path.getsize(file_path) > MAX_SIZE_BYTES:
                  print(f"📦 File '{os.path.basename(file_path)}' exceeds 7.5GB. Splitting into chunks...")
                  # Use Linux split command: -b 7500M creates parts like file.zip.aa, file.zip.ab
                  subprocess.run(["split", "-b", "7500M", "-d", file_path, f"{file_path}."], check=True)
                  os.remove(file_path)
                  print(f"✂️ Successfully split and removed original oversized file.")

          def get_video_files(directory):
              videos = []
              for root, _, files in os.walk(directory):
                  for file in files:
                      if file.lower().endswith(video_extensions):
                          videos.append(os.path.join(root, file))
              return sorted(videos)

          items = os.listdir(root_dir)

          # 1. Handle Subdirectories / Folders
          for item in items:
              item_path = os.path.join(root_dir, item)
              if os.path.isdir(item_path):
                  videos = get_video_files(item_path)
                  count = len(videos)
                  
                  if count > 4:
                      zip_name = f"{item}.zip"
                      zip_path = os.path.join(root_dir, zip_name)
                      print(f"🗜️ Subdirectory '{item}' has {count} videos (>4). Zipping into {zip_name}")
                      with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                          for root, _, files in os.walk(item_path):
                              for file in files:
                                  file_path = os.path.join(root, file)
                                  arcname = os.path.relpath(file_path, item_path)
                                  zipf.write(file_path, arcname)
                      shutil.rmtree(item_path)
                      split_large_file(zip_path)
                  else:
                      print(f"📁 Subdirectory '{item}' has {count} videos (≤4). Unpacking files to root for loose handling.")
                      for root, _, files in os.walk(item_path):
                        for file in files:
                              src = os.path.join(root, file)
                              dst = os.path.join(root_dir, file)
                              if not os.path.exists(dst):
                                  shutil.move(src, dst)
                      shutil.rmtree(item_path, ignore_errors=True)

          # Collect remaining loose video files at root level
          root_videos = sorted([os.path.join(root_dir, f) for f in os.listdir(root_dir) if f.lower().endswith(video_extensions) and not f.endswith(('.aa', '.ab', '.ac', '.ad'))])
          total_root_videos = len(root_videos)

          if total_root_videos > 3:
              first_ep_name = os.path.splitext(os.path.basename(root_videos[0]))[0]
              zip_name = f"{first_ep_name}.zip"
              zip_path = os.path.join(root_dir, zip_name)
              print(f"🗜️ Series detected ({total_root_videos} videos > 3). Zipping into {zip_name}")
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for v in root_videos:
                      zipf.write(v, os.path.basename(v))
              for v in root_videos:
                  os.remove(v)
              split_large_file(zip_path)
          else:
              print(f"📂 Found {total_root_videos} video file(s) (≤3). Skipping zipping — evaluating individual file sizes.")
              for v in root_videos:
                  if os.path.getsize(v) > MAX_SIZE_BYTES:
                      split_large_file(v)

          print("✅ Smart zipping and splitting sequence completed successfully.")
          EOF

      - name: Upload Processed Files via Dynamic Server API
        env:
          USER_HASH: '${{ env.VIKINGFILE_USER_HASH }}'
        run: |
          python3 - << 'EOF'
          import os
          import requests

          folder_path = "downloaded_files"
          user_hash = os.environ.get("VIKINGFILE_USER_HASH")

          if not os.path.exists(folder_path):
              print("❌ Target folder does not exist.")
              exit(0)

          print("🔍 Fetching active VikingFile upload server node...")
          upload_api = "https://vikingfile.com/api/get-server"
          try:
              server_res = requests.get(upload_api, timeout=15)
              server_data = server_res.json()
              target_upload_url = server_data.get("server")
              if not target_upload_url:
                  target_upload_url = "https://upload.vikingfile.com/api/upload"
              print(f"✅ Target upload node acquired: {target_upload_url}")
          except Exception as e:
              print(f"⚠️ Failed to query dynamic upload server, falling back to default: {e}")
              target_upload_url = "https://upload.vikingfile.com/api/upload"

          print(f"🚀 Starting robust multi-part file stream upload...")

          for root, _, files in os.walk(folder_path):
              for file in sorted(files):
                  if file.endswith(('.!qB', '.part')) or '/.' in file:
                      continue
                  
                  file_path = os.path.join(root, file)
                  file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
                  print(f"Uploading file part/file: {file} ({file_size_mb:.2f} MB)")

                  try:
                      with open(file_path, 'rb') as f:
                          files_payload = {'file': (file, f)}
                          data_payload = {'user': user_hash}
                          
                          response = requests.post(target_upload_url, files=files_payload, data=data_payload, timeout=600)
                          print(f"Status Code: {response.status_code}")
                          print(f"Response: {response.text[:300]}")
                  except Exception as e:
                      print(f"❌ Failed to upload {file}: {e}")

          print("✅ Upload batch procedure finished.")
          EOF
